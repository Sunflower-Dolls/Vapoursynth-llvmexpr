name: Build All (reusable)

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      libc:
        required: false
        type: string
      artifact_name:
        required: true
        type: string
      library_name:
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ inputs.os }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      PIP_CACHE_DIR: ${{ github.workspace }}/.pip-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Meson wrap downloads
        uses: actions/cache@v4
        with:
          path: subprojects/packagecache
          key: meson-wrap-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            meson-wrap-${{ runner.os }}-

      - name: Cache ccache (Unix)
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Cache pip downloads (Unix)
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: pip-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Cache Homebrew downloads (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
          key: macos-caches-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            macos-caches-${{ runner.os }}-

      - name: Cache Lavapipe (Windows)
        if: runner.os == 'Windows'
        id: cache_lavapipe
        uses: actions/cache@v4
        with:
          path: C:/lavapipe
          key: lavapipe-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            lavapipe-${{ runner.os }}-

      - name: Cache ccache (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-windows-${{ github.sha }}
          restore-keys: |
            ccache-windows-

      # Linux specific setup
      - name: Setup dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            pkg-config \
            python3 \
            python3-pip \
            curl \
            unzip \
            zip \
            zstd \
            liblzma-dev \
            libc++-dev \
            libc++abi-dev \
            libshaderc-dev \
            libvulkan-dev

          pip install meson ninja

      # macOS specific setup
      # Requires llvm20, see https://github.com/Homebrew/homebrew-core/issues/235411
      - name: Setup dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ccache meson ninja pkg-config llvm@20 vapoursynth zstd zlib shaderc vulkan-loader molten-vk

      # Install Lavapipe for Vulkan software rasterization (Windows)
      - name: Setup Lavapipe (Windows)
        if: runner.os == 'Windows' && steps.cache_lavapipe.outputs.cache-hit != 'true'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_lavapipe: true
          lavapipe_destination: "C:/lavapipe"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Windows specific setup
      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          cache: true
          msystem: MINGW64
          install: >-
            base-devel
            ccache
            git
            ninja
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pytest
            mingw-w64-x86_64-python-numpy
            curl
            unzip
            zip
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-lld
            mingw-w64-x86_64-llvm
            mingw-w64-x86_64-vapoursynth
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-shaderc
            mingw-w64-x86_64-glslang
            mingw-w64-x86_64-spirv-tools
            mingw-w64-x86_64-vulkan-loader
            mingw-w64-x86_64-vulkan-headers

      - name: Force static zstd linkage (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          pacman -S --noconfirm libzstd-devel
          ls -la /mingw64/lib/libzstd.a || echo "Warning: libzstd.a not found"
          pkg-config --libs --static libzstd || echo "Warning: pkg-config libzstd failed"
          cp $MSYSTEM_PREFIX/lib/libzstd.{a,dll.a}

      # Common steps for Linux
      - name: Cache VapourSynth headers (Linux)
        if: runner.os == 'Linux'
        id: cache_vs_headers
        uses: actions/cache@v4
        with:
          path: vapoursynth/include
          key: vs-headers-${{ runner.os }}-v1
          restore-keys: |
            vs-headers-${{ runner.os }}-

      - name: Download VS headers (Linux)
        if: runner.os == 'Linux' && steps.cache_vs_headers.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if [ ! -d vapoursynth/include ]; then
            rm -rf vapoursynth
            git clone https://github.com/vapoursynth/vapoursynth --depth=1
          else
            echo "Using cached VapourSynth headers"
          fi

      - name: Download VS headers and patch header location (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p vapoursynth/include
          cp vapoursynth/include/*.h llvmexpr

          find llvmexpr -type f \( -name "*.cpp" -o -name "*.hpp" \) | while read -r file; do
            dir=$(dirname "$file")
            
            if [ "$dir" == "llvmexpr" ]; then
              sed -i 's|#include [<"]VapourSynth4\.h[">]|#include "VapourSynth4.h"|g' "$file"
              continue
            fi

            relative_path=${dir#llvmexpr/}
            
            depth=$(echo "$relative_path" | tr -cd '/' | wc -c)
            depth=$((depth + 1))
            
            prefix=$(printf '../'%.0s $(seq 1 $depth))
            
            sed -i "s|#include [<\"].*VapourSynth4\.h[>\"]|#include \"${prefix}VapourSynth4.h\"|g" "$file"
          done

      - name: Create fake VapourSynth pkg-config file (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p $HOME/pkgconfig
          cat > $HOME/pkgconfig/vapoursynth.pc << 'EOF'
          prefix=/usr/local
          exec_prefix=${prefix}
          libdir=${exec_prefix}/lib
          includedir=${prefix}/include

          Name: VapourSynth
          Description: A video processing framework
          Version: 72.0
          Libs: -L${libdir}
          Cflags: -I${includedir}
          EOF
          echo "PKG_CONFIG_PATH=$HOME/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
      - name: Install LLVM 21 (Linux)
        if: runner.os == 'Linux'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21

      # Set environment variables
      - name: Set environment variables (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "/usr/lib/llvm-21/bin" >> $GITHUB_PATH
          echo "LLVM_CONFIG=/usr/lib/llvm-21/bin/llvm-config" >> $GITHUB_ENV
      - name: Set environment variables (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "$(brew --prefix llvm@20)/bin" >> $GITHUB_PATH
          echo "CPATH=/opt/homebrew/include" >> $GITHUB_ENV
          echo "LIBRARY_PATH=/opt/homebrew/lib" >> $GITHUB_ENV
          PKG_CONFIG_PATHS=""
          for lib in zlib zstd libxml2 icu4c; do
            if [ -d "$(brew --prefix $lib)/lib/pkgconfig" ]; then
              PKG_CONFIG_PATHS="$(brew --prefix $lib)/lib/pkgconfig:$PKG_CONFIG_PATHS"
            fi
          done
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATHS}$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - name: Show tool versions (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          clang --version || true
          g++ --version || true
          meson --version
          ninja --version
          llvm-config --version
          pkg-config --version
      - name: Show tool versions (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          clang --version || true
          g++ --version || true
          meson --version
          ninja --version
          llvm-config --version
          pkg-config --version

      - name: Check LLVM version (>= 21) (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -e
          ver=$(llvm-config --version | cut -d. -f1)
          if [ "$ver" -lt 21 ]; then
            echo "LLVM >= 21 is required, found: $(llvm-config --version)" >&2
            exit 1
          fi
      - name: Check LLVM version (>= 21) (Unix)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -e
          ver=$(llvm-config --version | cut -d. -f1)
          if [ "$ver" -lt 21 ]; then
            echo "LLVM >= 21 is required, found: $(llvm-config --version)" >&2
            exit 1
          fi
      - name: Check LLVM version (= 20) (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          ver=$(llvm-config --version | cut -d. -f1)
          if [ "$ver" -ne 20 ]; then
            echo "LLVM 20 is required on macOS, found: $(llvm-config --version)" >&2
            exit 1
          fi

      - name: Configure (Meson) with SSL fix (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export CCACHE_DIR="$(cygpath -u "$GITHUB_WORKSPACE")/.ccache"
          mkdir -p "$CCACHE_DIR"

          # Fix SSL certificates for Python/Meson
          echo "Fixing SSL certificates..."
          curl -sSL https://curl.se/ca/cacert.pem -o /tmp/cacert.pem
          
          # Import to Windows certificate store via PowerShell
          powershell.exe -Command "Import-Certificate -FilePath /tmp/cacert.pem -CertStoreLocation Cert:\LocalMachine\Root -ErrorAction SilentlyContinue" || true
          
          # Also set SSL cert file for Python
          export SSL_CERT_FILE=/tmp/cacert.pem
          export REQUESTS_CA_BUNDLE=/tmp/cacert.pem
          export CURL_CA_BUNDLE=/tmp/cacert.pem
          
          # Configure Meson
          CC="ccache clang -fuse-ld=lld" CXX="ccache clang++ -fuse-ld=lld" meson setup builddir \
            -Dstatic-llvm=true \
            -Dstatic-shaderc=true \
            -Denable-sanitizers=true \
            --buildtype=debug
      - name: Configure (Meson) (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$CCACHE_DIR" "$PIP_CACHE_DIR"
          CC="ccache clang" CXX="ccache clang++ -stdlib=libc++" meson setup builddir \
            -Dstatic-llvm=true \
            -Dstatic-shaderc=true \
            -Denable-sanitizers=true \
            --buildtype=debug

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          ninja -C builddir
      - name: Build (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ninja -C builddir

      - name: Show ccache stats (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ccache -s || true

      - name: Show ccache stats (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export CCACHE_DIR="$(cygpath -u "$GITHUB_WORKSPACE")/.ccache"
          ccache -s || true

      - name: Check dependencies (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ldd builddir/${{ inputs.library_name }}

      - name: Check dependencies (Linux)
        if: runner.os == 'Linux'
        run: ldd builddir/${{ inputs.library_name }}

      - name: Check dependencies (macOS)
        if: runner.os == 'macOS'
        run: otool -L builddir/${{ inputs.library_name }}

      - name: Run benchmarks (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export PYTHONPATH=""
          export VK_LOADER_DEBUG=all
          export CCACHE_DIR="$(cygpath -u "$GITHUB_WORKSPACE")/.ccache"

          # Build release
          CC="ccache clang -fuse-ld=lld" CXX="ccache clang++ -fuse-ld=lld" meson setup builddir_release \
            -Dstatic-llvm=true \
            -Dstatic-shaderc=true \
            -Denable-sanitizers=false \
            --buildtype=release
          ninja -C builddir_release

          export LLVMEXPR_PLUGIN_PATH="builddir_release/${{ inputs.library_name }}"
          
          # Force use of Lavapipe for Vulkan
          export VK_ICD_FILENAMES="C:/lavapipe/share/vulkan/icd.d/lvp_icd.x86_64.json"
          powershell.exe -Command "reg add \"HKLM\SOFTWARE\Khronos\Vulkan\Drivers\" /v \"C:\lavapipe\share\vulkan\icd.d\lvp_icd.x86_64.json\" /t REG_DWORD /d 0 /f"
          
          python benchmarks/benchmark.py \
            --llvmexpr-plugin "$PWD/builddir_release/${{ inputs.library_name }}" \
            --backends "llvmexpr,VkExpr" \
            --frames 800 \
            --warmup 5 \
            --fail-on-no-results \
            --require-backend llvmexpr \
            --json benchmark-results.json \

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export PYTHONPATH=""
          export VK_LOADER_DEBUG=all
          export CCACHE_DIR="$(cygpath -u "$GITHUB_WORKSPACE")/.ccache"
          export LLVMEXPR_PLUGIN_PATH="builddir/${{ inputs.library_name }}"
          
          # Force use of Lavapipe for Vulkan
          export VK_ICD_FILENAMES="C:/lavapipe/share/vulkan/icd.d/lvp_icd.x86_64.json"
          powershell.exe -Command "reg add \"HKLM\SOFTWARE\Khronos\Vulkan\Drivers\" /v \"C:\lavapipe\share\vulkan\icd.d\lvp_icd.x86_64.json\" /t REG_DWORD /d 0 /f"
          
          echo "Running pytest with Lavapipe..."
          python -m pytest -vv

      - name: Run benchmarks (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export PYTHONPATH=""
          export VK_LOADER_DEBUG=all

          # Build release
          mkdir -p "$CCACHE_DIR" "$PIP_CACHE_DIR"
          CC="ccache clang" CXX="ccache clang++ -stdlib=libc++" meson setup builddir_release \
            -Dstatic-llvm=true \
            -Dstatic-shaderc=true \
            -Denable-sanitizers=false \
            --buildtype=release
          ninja -C builddir_release

          export LLVMEXPR_PLUGIN_PATH="builddir_release/${{ inputs.library_name }}"

          python3 benchmarks/benchmark.py \
            --llvmexpr-plugin "$PWD/builddir_release/${{ inputs.library_name }}" \
            --backends "llvmexpr,VkExpr" \
            --frames 5000 \
            --warmup 20 \
            --fail-on-no-results \
            --require-backend llvmexpr \
            --require-backend VkExpr \
            --json benchmark-results.json \

      - name: Upload benchmark results
        if: runner.os == 'Windows' || runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ inputs.artifact_name }}
          path: benchmark-results.json
          if-no-files-found: warn

      - name: Run tests (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export PYTHONPATH=""
          export VK_LOADER_DEBUG=all
          export LLVMEXPR_PLUGIN_PATH="builddir/${{ inputs.library_name }}"
          
          pip3 install pytest numpy --break-system-packages

          python3 -m pytest -vv

      - name: Install to staging dir (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          DESTDIR="$PWD/stage" meson install -C builddir
          find stage -maxdepth 5 -type f -print
      - name: Install to staging dir (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          DESTDIR="$PWD/stage" meson install -C builddir
          find stage -maxdepth 5 -type f -print

      - name: Collect artifact (Windows)
        id: collect_windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -e
          libfile=$(find stage -type f -name '${{ inputs.library_name }}' | head -n 1)
          if [ -z "$libfile" ]; then
            echo "${{ inputs.library_name }} not found in install tree" >&2
            exit 1
          fi
          outdir=artifact
          mkdir -p "$outdir"
          cp "$libfile" "$outdir/${{ inputs.library_name }}"
          cp LICENSE "$outdir/" || true
          cp README.md "$outdir/" || true
          echo "artifact_dir=$outdir" >> $GITHUB_OUTPUT
      - name: Collect artifact (Unix)
        id: collect_unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          libfile=$(find stage -type f -name '${{ inputs.library_name }}' | head -n 1)
          if [ -z "$libfile" ]; then
            echo "${{ inputs.library_name }} not found in install tree" >&2
            exit 1
          fi
          outdir=artifact
          mkdir -p "$outdir"
          cp "$libfile" "$outdir/${{ inputs.library_name }}"
          cp LICENSE "$outdir/" || true
          cp README.md "$outdir/" || true
          echo "artifact_dir=$outdir" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ steps.collect_windows.outputs.artifact_dir || steps.collect_unix.outputs.artifact_dir }}
          if-no-files-found: error
