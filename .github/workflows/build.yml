name: Build and Release

on:
  push:
    branches: [main]
    tags: ["R*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-release:
    name: Windows x64 Release
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            libc: ""
            artifact_name: llvmexpr-windows-x64-static-llvm21-static-shaderc
            library_name: libllvmexpr.dll

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Windows specific setup
      - name: Setup MSYS2 (Windows)
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: MINGW64
          install: >-
            base-devel
            git
            ninja
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-python
            curl
            unzip
            zip
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-lld
            mingw-w64-x86_64-llvm
            mingw-w64-x86_64-vapoursynth
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-shaderc
            mingw-w64-x86_64-vulkan-loader
            mingw-w64-x86_64-vulkan-headers

      - name: Force static zstd linkage (Windows)
        shell: msys2 {0}
        run: |
          pacman -S --noconfirm libzstd-devel
          ls -la /mingw64/lib/libzstd.a || echo "Warning: libzstd.a not found"
          pkg-config --libs --static libzstd || echo "Warning: pkg-config libzstd failed"
          cp $MSYSTEM_PREFIX/lib/libzstd.{a,dll.a}

      - name: Show tool versions (Windows)
        shell: msys2 {0}
        run: |
          clang --version || true
          g++ --version || true
          meson --version
          ninja --version
          llvm-config --version
          pkg-config --version

      - name: Check LLVM version (>= 21) (Windows)
        shell: msys2 {0}
        run: |
          set -e
          ver=$(llvm-config --version | cut -d. -f1)
          if [ "$ver" -lt 21 ]; then
            echo "LLVM >= 21 is required, found: $(llvm-config --version)" >&2
            exit 1
          fi

      - name: Configure (Meson) with SSL fix (Windows)
        shell: msys2 {0}
        run: |
          # Fix SSL certificates for Python/Meson
          echo "Fixing SSL certificates..."
          curl -sSL https://curl.se/ca/cacert.pem -o /tmp/cacert.pem
          
          # Import to Windows certificate store via PowerShell
          powershell.exe -Command "Import-Certificate -FilePath /tmp/cacert.pem -CertStoreLocation Cert:\LocalMachine\Root -ErrorAction SilentlyContinue" || true
          
          # Also set SSL cert file for Python
          export SSL_CERT_FILE=/tmp/cacert.pem
          export REQUESTS_CA_BUNDLE=/tmp/cacert.pem
          export CURL_CA_BUNDLE=/tmp/cacert.pem
          
          # Configure Meson
          CC="clang -fuse-ld=lld" CXX="clang++ -fuse-ld=lld" meson setup builddir \
            -Dstatic-llvm=true \
            -Dstatic-shaderc=true \
            --buildtype=release

      - name: Build (Windows)
        shell: msys2 {0}
        run: |
          ninja -C builddir

      - name: Check dependencies (Windows)
        shell: msys2 {0}
        run: ldd builddir/${{ matrix.library_name }}

      - name: Install to staging dir (Windows)
        shell: msys2 {0}
        run: |
          DESTDIR="$PWD/stage" meson install -C builddir
          find stage -maxdepth 5 -type f -print

      - name: Collect artifact (Windows)
        id: collect_windows
        shell: msys2 {0}
        run: |
          set -e
          libfile=$(find stage -type f -name '${{ matrix.library_name }}' | head -n 1)
          if [ -z "$libfile" ]; then
            echo "${{ matrix.library_name }} not found in install tree" >&2
            exit 1
          fi
          outdir=artifact
          mkdir -p "$outdir"
          cp "$libfile" "$outdir/${{ matrix.library_name }}"
          cp LICENSE "$outdir/" || true
          cp README.md "$outdir/" || true
          echo "artifact_dir=$outdir" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ steps.collect_windows.outputs.artifact_dir }}
          if-no-files-found: error

  build-all:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64-glibc
            os: ubuntu-latest
            libc: glibc
            artifact_name: llvmexpr-linux-x64-glibc-static-llvm21-static-shaderc
            library_name: libllvmexpr.so

          - name: macOS arm64
            os: macos-latest
            libc: ""
            artifact_name: llvmexpr-macos-arm64-static-llvm21-static-shaderc
            library_name: libllvmexpr.dylib
          - name: Windows x64
            os: windows-latest
            libc: ""
            artifact_name: llvmexpr-windows-x64-static-llvm21-static-shaderc
            library_name: libllvmexpr.dll

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Linux specific setup
      - name: Setup dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            python3 \
            python3-pip \
            curl \
            unzip \
            zip \
            zstd \
            liblzma-dev \
            libc++-dev \
            libc++abi-dev \
            libshaderc-dev \
            libvulkan-dev

          pip install meson ninja

      # macOS specific setup
      - name: Setup dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install meson ninja pkg-config llvm vapoursynth zstd zlib shaderc vulkan-loader

      # Windows specific setup
      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: MINGW64
          install: >-
            base-devel
            git
            ninja
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-python
            curl
            unzip
            zip
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-lld
            mingw-w64-x86_64-llvm
            mingw-w64-x86_64-vapoursynth
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-shaderc
            mingw-w64-x86_64-vulkan-loader
            mingw-w64-x86_64-vulkan-headers

      - name: Force static zstd linkage (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          pacman -S --noconfirm libzstd-devel
          ls -la /mingw64/lib/libzstd.a || echo "Warning: libzstd.a not found"
          pkg-config --libs --static libzstd || echo "Warning: pkg-config libzstd failed"
          cp $MSYSTEM_PREFIX/lib/libzstd.{a,dll.a}

      # Common steps for Linux
      - name: Download VS headers and patch header location (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          git clone https://github.com/vapoursynth/vapoursynth --depth=1
          cp vapoursynth/include/*.h llvmexpr

          find llvmexpr -type f \( -name "*.cpp" -o -name "*.hpp" \) | while read -r file; do
            dir=$(dirname "$file")
            
            if [ "$dir" == "llvmexpr" ]; then
              sed -i 's|#include [<"]VapourSynth4\.h[">]|#include "VapourSynth4.h"|g' "$file"
              continue
            fi

            relative_path=${dir#llvmexpr/}
            
            depth=$(echo "$relative_path" | tr -cd '/' | wc -c)
            depth=$((depth + 1))
            
            prefix=$(printf '../'%.0s $(seq 1 $depth))
            
            sed -i "s|#include [<\"].*VapourSynth4\.h[>\"]|#include \"${prefix}VapourSynth4.h\"|g" "$file"
          done

      - name: Create fake VapourSynth pkg-config file (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p $HOME/pkgconfig
          cat > $HOME/pkgconfig/vapoursynth.pc << 'EOF'
          prefix=/usr/local
          exec_prefix=${prefix}
          libdir=${exec_prefix}/lib
          includedir=${prefix}/include

          Name: VapourSynth
          Description: A video processing framework
          Version: 72.0
          Libs: -L${libdir}
          Cflags: -I${includedir}
          EOF
          echo "PKG_CONFIG_PATH=$HOME/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
      - name: Install LLVM 21 (Linux)
        if: runner.os == 'Linux'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21

      # Set environment variables
      - name: Set environment variables (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "/usr/lib/llvm-21/bin" >> $GITHUB_PATH
          echo "LLVM_CONFIG=/usr/lib/llvm-21/bin/llvm-config" >> $GITHUB_ENV
      - name: Set environment variables (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH
          echo "CPATH=/opt/homebrew/include" >> $GITHUB_ENV
          echo "LIBRARY_PATH=/opt/homebrew/lib" >> $GITHUB_ENV
          PKG_CONFIG_PATHS=""
          for lib in zlib zstd libxml2 icu4c; do
            if [ -d "$(brew --prefix $lib)/lib/pkgconfig" ]; then
              PKG_CONFIG_PATHS="$(brew --prefix $lib)/lib/pkgconfig:$PKG_CONFIG_PATHS"
            fi
          done
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATHS}$PKG_CONFIG_PATH" >> $GITHUB_ENV

      - name: Show tool versions (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          clang --version || true
          g++ --version || true
          meson --version
          ninja --version
          llvm-config --version
          pkg-config --version
      - name: Show tool versions (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          clang --version || true
          g++ --version || true
          meson --version
          ninja --version
          llvm-config --version
          pkg-config --version

      - name: Check LLVM version (>= 21) (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -e
          ver=$(llvm-config --version | cut -d. -f1)
          if [ "$ver" -lt 21 ]; then
            echo "LLVM >= 21 is required, found: $(llvm-config --version)" >&2
            exit 1
          fi
      - name: Check LLVM version (>= 21) (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          ver=$(llvm-config --version | cut -d. -f1)
          if [ "$ver" -lt 21 ]; then
            echo "LLVM >= 21 is required, found: $(llvm-config --version)" >&2
            exit 1
          fi

      - name: Configure (Meson) with SSL fix (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          # Fix SSL certificates for Python/Meson
          echo "Fixing SSL certificates..."
          curl -sSL https://curl.se/ca/cacert.pem -o /tmp/cacert.pem
          
          # Import to Windows certificate store via PowerShell
          powershell.exe -Command "Import-Certificate -FilePath /tmp/cacert.pem -CertStoreLocation Cert:\LocalMachine\Root -ErrorAction SilentlyContinue" || true
          
          # Also set SSL cert file for Python
          export SSL_CERT_FILE=/tmp/cacert.pem
          export REQUESTS_CA_BUNDLE=/tmp/cacert.pem
          export CURL_CA_BUNDLE=/tmp/cacert.pem
          
          # Configure Meson
          CC="clang -fuse-ld=lld" CXX="clang++ -fuse-ld=lld" meson setup builddir \
            -Dstatic-llvm=true \
            -Dstatic-shaderc=true \
            -Denable-sanitizers=true \
            --buildtype=debug
      - name: Configure (Meson) (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          CC=clang CXX="clang++ -stdlib=libc++" meson setup builddir \
            -Dstatic-llvm=true \
            -Dstatic-shaderc=true \
            -Denable-sanitizers=true \
            --buildtype=debug

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          ninja -C builddir
      - name: Build (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ninja -C builddir

      - name: Check dependencies (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ldd builddir/${{ matrix.library_name }}

      - name: Check dependencies (Linux)
        if: runner.os == 'Linux'
        run: ldd builddir/${{ matrix.library_name }}

      - name: Check dependencies (macOS)
        if: runner.os == 'macOS'
        run: otool -L builddir/${{ matrix.library_name }}

      - name: Install to staging dir (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          DESTDIR="$PWD/stage" meson install -C builddir
          find stage -maxdepth 5 -type f -print
      - name: Install to staging dir (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          DESTDIR="$PWD/stage" meson install -C builddir
          find stage -maxdepth 5 -type f -print

      - name: Collect artifact (Windows)
        id: collect_windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -e
          libfile=$(find stage -type f -name '${{ matrix.library_name }}' | head -n 1)
          if [ -z "$libfile" ]; then
            echo "${{ matrix.library_name }} not found in install tree" >&2
            exit 1
          fi
          outdir=artifact
          mkdir -p "$outdir"
          cp "$libfile" "$outdir/${{ matrix.library_name }}"
          cp LICENSE "$outdir/" || true
          cp README.md "$outdir/" || true
          echo "artifact_dir=$outdir" >> $GITHUB_OUTPUT
      - name: Collect artifact (Unix)
        id: collect_unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          libfile=$(find stage -type f -name '${{ matrix.library_name }}' | head -n 1)
          if [ -z "$libfile" ]; then
            echo "${{ matrix.library_name }} not found in install tree" >&2
            exit 1
          fi
          outdir=artifact
          mkdir -p "$outdir"
          cp "$libfile" "$outdir/${{ matrix.library_name }}"
          cp LICENSE "$outdir/" || true
          cp README.md "$outdir/" || true
          echo "artifact_dir=$outdir" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ steps.collect_windows.outputs.artifact_dir || steps.collect_unix.outputs.artifact_dir }}
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build-windows-release
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release_assets
          for dir in artifacts/*;
          do
            if [ -d "$dir" ]; then
              artifact_name=$(basename "$dir")
              (cd "$dir" && zip -9r "../../release_assets/${artifact_name}.zip" .)
            fi
          done

      - name: List created assets
        run: ls -l release_assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*.zip
