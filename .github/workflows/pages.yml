name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "Doxyfile"
      - "README.md"
      - "docs/**"
      - "**/*.h"
      - "**/*.hpp"
      - "**/*.c"
      - "**/*.cpp"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOXYGEN_VERSION: "1.15.0"
      DOXYGEN_AWESOME_VERSION: "2.4.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install Doxygen (pinned)
        shell: bash
        run: |
          set -euo pipefail
          ver="${DOXYGEN_VERSION}"
          tag="Release_${ver//./_}"
          url="https://github.com/doxygen/doxygen/releases/download/${tag}/doxygen-${ver}.linux.bin.tar.gz"
          curl -fsSL "$url" -o doxygen.tar.gz
          tar -xzf doxygen.tar.gz
          install_dir="$PWD/doxygen-${ver}"
          echo "$install_dir/bin" >> "$GITHUB_PATH"
          "$install_dir/bin/doxygen" -v

      - name: Download Doxygen Awesome CSS (pinned)
        shell: bash
        run: |
          set -euo pipefail
          ver="${DOXYGEN_AWESOME_VERSION}"
          base="https://raw.githubusercontent.com/jothepro/doxygen-awesome-css/v${ver}"
          curl -fsSL "${base}/doxygen-awesome.css" -o docs/doxygen-awesome.css

      - name: Create output directory
        run: mkdir -p build/docs

      - name: Generate docs
        run: doxygen Doxyfile

      - name: Add CNAME
        run: |
          if [ -f docs/CNAME ]; then
            domain="$(tr -d '\r\n' < docs/CNAME)"
            printf '%s\n' "$domain" > build/docs/html/CNAME
          fi

      - name: Copy docs sources
        run: |
          cp -a README.md build/docs/html/README.md
          cp -a docs build/docs/html/docs

      - name: Disable Jekyll
        run: touch build/docs/html/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
